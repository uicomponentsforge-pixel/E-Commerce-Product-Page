<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaShop — Modern E-Commerce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <a href="#" class="logo" id="logoLink">
        <div class="logo-icon">N</div>
        <span>NovaShop</span>
      </a>

      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <input type="search" id="searchInput" placeholder="Search products..." autocomplete="off" />
      </div>

      <div class="header-actions">
        <button class="cart-btn" id="cartBtn" aria-label="Open cart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6h15l-1.5 9H8L6 6z"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M6 6L5 2H2"/>
          </svg>
          <span>Cart</span>
          <span class="cart-count hidden" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="filter-group">
        <h3>Categories</h3>
        <ul class="category-list" id="categoryList"></ul>
      </div>

      <div class="filter-group">
        <h3>Sort By</h3>
        <select class="sort-select" id="sortSelect">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name: A–Z</option>
          <option value="name-desc">Name: Z–A</option>
          <option value="rating">Top Rated</option>
        </select>
      </div>

      <div class="filter-group">
        <h3>Max Price</h3>
        <div class="price-range">
          <label>
            <span>Up to</span>
            <strong id="priceLabel">$500</strong>
          </label>
          <input type="range" id="priceRange" min="20" max="500" value="500" step="10" />
        </div>
      </div>
    </aside>

    <!-- PRODUCTS -->
    <section>
      <div class="products-header">
        <h2 id="sectionTitle">All Products</h2>
        <span class="results-count" id="resultsCount"></span>
      </div>
      <div class="products-grid" id="productsGrid"></div>
    </section>
  </main>

  <!-- PRODUCT DETAIL MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-img" id="modalImg"></div>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <!-- CART -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="cart-close" id="cartClose" aria-label="Close cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <strong id="cartTotal">$0.00</strong>
      </div>
      <button class="checkout-btn" id="checkoutBtn" disabled>Proceed to Checkout</button>
    </div>
  </aside>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
